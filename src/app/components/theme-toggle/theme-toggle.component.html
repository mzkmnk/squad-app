<button
  hlmBtn
  variant="ghost"
  size="sm"
  class="h-9 w-9 rounded-md p-0"
  (click)="toggleTheme()"
  [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.title]="isDarkMode() ? 'Light Mode' : 'Dark Mode'"
>
  <ng-icon hlm [name]="currentIcon()" size="md" />
</button>
